<VirtualHost *:443>
    ServerName sql-canvas.internal.example
    DocumentRoot /var/www/sql-canvas/public

    <Directory /var/www/sql-canvas/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Keep perimeter authentication and TLS configuration at the host/reverse proxy.
    # Never expose this administrative application directly to the public internet.
    ErrorLog ${APACHE_LOG_DIR}/sql-canvas-error.log
    CustomLog ${APACHE_LOG_DIR}/sql-canvas-access.log combined
</VirtualHost>

