server {
    listen 443 ssl http2;
    server_name sql-canvas.internal.example;
    root /var/www/sql-canvas/public;
    index index.php;

    # Add organization-approved TLS and perimeter authentication here.
    # Keep SQL Canvas on localhost, a VPN, or a private administration network.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

