name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SQL Canvas. Remove credentials, private hostnames, and real database values before posting.
  - type: input
    id: version
    attributes:
      label: SQL Canvas version or commit
      placeholder: v1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database server
      options:
        - MySQL 8.x
        - MariaDB 11.x
        - Other
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: 8.2.20
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Connect to…\n2. Open…\n3. Select…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Never include passwords, cookies, tokens, private SQL, or real row data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private hostnames, and operational data.
          required: true
